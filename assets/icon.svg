<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- terminal tile -->
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#bg)"/>
  <circle cx="120" cy="112" r="92" fill="url(#glow)"/>
  <g stroke="#22D3EE" stroke-width="1" opacity="0.10">
    <path d="M28 84 H212 M28 128 H212 M28 172 H212"/>
    <path d="M72 32 V208 M120 32 V208 M168 32 V208"/>
  </g>

  <!-- back hair -->
  <circle cx="120" cy="98" r="74" fill="url(#hair)"/>

  <!-- headphones -->
  <path d="M50 100 Q120 34 190 100" fill="none" stroke="#0B1220" stroke-width="12" stroke-linecap="round"/>
  <rect x="38" y="94" width="24" height="36" rx="12" fill="#1F2937" stroke="#22D3EE" stroke-width="2.5"/>
  <rect x="178" y="94" width="24" height="36" rx="12" fill="#1F2937" stroke="#F472B6" stroke-width="2.5"/>
  <circle cx="50" cy="112" r="4" fill="#22D3EE"/>
  <circle cx="190" cy="112" r="4" fill="#F472B6"/>

  <!-- face -->
  <circle cx="120" cy="110" r="56" fill="#FFE7CB"/>

  <!-- bangs + side hair -->
  <path d="M56 110 Q56 54 120 52 Q184 54 184 110 Q170 80 152 94 Q140 70 120 86 Q100 70 88 94 Q70 80 56 110 Z" fill="url(#hair)"/>
  <path d="M58 104 Q44 152 60 184 Q74 150 70 116 Z" fill="url(#hair)"/>
  <path d="M182 104 Q196 152 180 184 Q166 150 170 116 Z" fill="url(#hair)"/>
  <!-- neon streak -->
  <path d="M150 62 Q178 72 184 106 L173 110 Q167 80 146 70 Z" fill="#22D3EE" opacity="0.9"/>

  <!-- eyes -->
  <g>
    <ellipse cx="96" cy="122" rx="11" ry="15" fill="#22D3EE"/>
    <ellipse cx="144" cy="122" rx="11" ry="15" fill="#22D3EE"/>
    <circle cx="92" cy="115" r="4.5" fill="#FFFFFF"/>
    <circle cx="140" cy="115" r="4.5" fill="#FFFFFF"/>
    <circle cx="99" cy="128" r="2.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="147" cy="128" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <!-- blush -->
  <ellipse cx="70" cy="144" rx="11" ry="6.5" fill="#F472B6" opacity="0.55"/>
  <ellipse cx="170" cy="144" rx="11" ry="6.5" fill="#F472B6" opacity="0.55"/>
  <!-- mouth -->
  <path d="M112 146 Q120 154 128 146" fill="none" stroke="#3A2A26" stroke-width="4.5" stroke-linecap="round"/>

  <!-- body / hoodie -->
  <rect x="84" y="166" width="72" height="52" rx="22" fill="#1F2937" stroke="#334155" stroke-width="2"/>
  <path d="M112 174 L110 196" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M128 174 L130 196" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- prompt glyph -->
  <path d="M104 206 L112 214 L104 222" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 222 H132" stroke="#F472B6" stroke-width="4" stroke-linecap="round"/>

  <!-- feet -->
  <rect x="94" y="214" width="22" height="12" rx="6" fill="#0B1220"/>
  <rect x="124" y="214" width="22" height="12" rx="6" fill="#0B1220"/>
</svg>
