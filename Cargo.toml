[package]
name = "maple"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "ai coding agent"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[dependencies]
maple-tui = { path = "crates/maple-tui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
