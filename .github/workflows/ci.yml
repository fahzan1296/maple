name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SOP-RESLIM.2: bound build parallelism; the project budgets for constrained
  # hosts (KONTRAK §SOP-RESLIM, PRD §11). One build job at a time: the test and
  # integration targets link large binaries and parallel codegen has OOMed on
  # small hosts.
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback: workspace build and core tests.
  # Kept separate from integration tests to prevent large linking workloads
  # from starving the main test job.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Windows is out of scope for v0.1 (PRD §15).
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build workspace
        timeout-minutes: 10
        run: cargo build --workspace

      - name: Test maple-tui library
        timeout-minutes: 10
        run: cargo test -p maple-tui --lib

  # Integration tests of maple-tui.
  # One job, no matrix: linking is the primary resource bottleneck.
  integration:
    name: integration (maple-tui tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run integration tests
        timeout-minutes: 25
        run: cargo test -p maple-tui --tests

  lint:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy maple-tui (all targets)
        timeout-minutes: 10
        run: cargo clippy -p maple-tui --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit

      - name: Audit dependencies
        timeout-minutes: 5
        run: cargo audit
