name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SOP-RESLIM.2: bound build parallelism; the project budgets for constrained
  # hosts (KONTRAK §SOP-RESLIM, PRD §11).
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    # ubuntu-latest/macOS-latest are acceptable here: every job is timeboxed
    # and pinned to two build jobs (SOP-RESLIM.2 sized runners).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Windows is out of scope for v0.1 (PRD §15).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        timeout-minutes: 5
        run: cargo build --workspace --all-targets
      - name: Test
        timeout-minutes: 10
        run: cargo test --workspace --all-targets -- --test-threads=2

  lint:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        timeout-minutes: 5
        run: cargo clippy --workspace --all-targets
