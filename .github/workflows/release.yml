name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        timeout-minutes: 15
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        timeout-minutes: 2
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar -czf "maple-${{ matrix.target }}.tar.gz" maple
      - uses: actions/upload-artifact@v4
        with:
          name: maple-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/maple-${{ matrix.target }}.tar.gz
          retention-days: 7

  publish:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: maple-*/maple-*.tar.gz
