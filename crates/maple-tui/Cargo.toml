[package]
name = "maple-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Terminal UI toolkit: differential renderer, component system, themes"
publish = false

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.11"
regex = "1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
